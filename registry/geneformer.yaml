model: Geneformer
version: "gf-12L-30M-i2048 (the model described in the 2023 paper; the repo default has since changed)"

paper:
  doi: 10.1038/s41586-023-06139-9
  pmid: 37258680
  journal: Nature
  published: 2023-05
  note: >
    Full text free via PMC10949956. Genecorpus-30M has a later 104M-cell successor and
    the repo default model is no longer the one the paper describes. Pin both.

manifest:
  type: A
  identifier_type: citation      # <- NOT accession. This is the whole difficulty.
  # The data availability statement does not point at the manifest. Quoted in full:
  quote: >
    "Genecorpus-30M is available on the Huggingface Dataset Hub at
    https://huggingface.co/datasets/ctheodoris/Genecorpus-30M."
  as_of: 2026-09-23
  resolver: xlsx_citation_keyed

  sources:
    - name: Supplementary Table 1 — Genecorpus-30M_composition
      url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-023-06139-9/MediaObjects/41586_2023_6139_MOESM4_ESM.xlsx
      format: xlsx
      level: dataset
      records: 561
      bytes: 119097
      sha256: bbfcddfa95a1565977fce9c60862032d061958ac5a4571942bd079a1a0a33e3f
      columns: [Dataset_ID, Organ_major, Organ_specific, Platform, Count_filtered,
                Mito_filtered, Gene_filtered, Pct_filtered, Total_cells,
                Total_cells_passed, Source]
      note: >
        URL inferred from the Springer ESM pattern and not yet followed. The sha256
        above is of the file as supplied locally. Resolve the URL before verification.

  # Integrity check, and it passes exactly:
  #    sum(Total_cells_passed) over all 561 rows = 27,406,217
  #    = the QC-passed count stated in the Methods and on the HF dataset card.
  #    A manifest that reconciles to the published total is the strongest form of
  #    completeness evidence available without the data itself.
  totals:
    source_datasets: 561
    distinct_source_publications: 112
    cells_collected: 29900531
    cells_after_qc: 27406217

  gaps:
    accessions_in_manifest: 0      # of 561 — every row is keyed by citation string only
    blank_source_citations: 0      # of 561

  # The corpus itself is also published — and carries no dataset-of-origin field.
  corpus_published:
    url: https://huggingface.co/datasets/ctheodoris/Genecorpus-30M
    commit: 71fae97a141652584e0cf09e8ace306e9b9e6d8c
    license: apache-2.0
    bytes: 130154073101
    fields: [input_ids, lengths]
    carries_provenance: false
    # Provenance existed upstream and did not survive tokenization. Methods:
    # "561 datasets were included and stored as uniform files in the .loom HDF5 format
    #  including metadata from the original studies as row (feature) and column (cell)
    #  attributes"
    # So the manifest, not the corpus, is what makes this model checkable.

evaluation_datasets:
  - name: Baron 2016
    accession: GSE84133
    pmid: 27667365
    task: >
      NOT a Geneformer evaluation dataset. Listed because it is scFoundation's
      clustering / read-depth evaluation dataset — this row exists for the ledger.
    obtained_from: cross-model (scFoundation registry entry)

result:
  checked: 2026-09-23
  sources_searched: [Supplementary Table 1 — Genecorpus-30M_composition]
  match_keys: [title]            # citation-string matching only — see caveats
  findings:
    - dataset: Baron 2016
      verdict: INCONCLUSIVE
      matched_on: [title]
      samples: 4
      cells: 8363
      reason: >
        Matched on citation string, not accession. The manifest carries no accessions,
        so this is a title/author match and the verdict rules cap it at INCONCLUSIVE
        until the citation is resolved through the crosswalk to a PMID. The match
        itself looks strong — "Baron, M. et al. A Single-Cell Transcriptomic Map of the
        Human and Mouse Pancreas… Cell Syst 3, 346-360.e4 (2016)" across 4 pancreas /
        inDrop rows totalling 8,363 QC-passed cells, consistent with GSE84133's 4 human
        donors — but "looks strong" is exactly what the INCONCLUSIVE tier is for.

  caveats:
    - >
      Two keyword near-misses in this manifest, both of which would be false
      positives under a looser rule:
        "Zheng"  matched Zheng, Y. et al. 2020 (aging / COVID-19 immune landscape) —
                 NOT Zheng et al. 2017, the Zheng68K benchmark.
        "Xin"    matched Xin, Y. et al. 2018 Diabetes — NOT Xin et al. 2016 Cell Metab,
                 the pancreas benchmark.
    - >
      Litviňuková et al. 2020 "Cells of the adult human heart" supplies
      2,106,773 QC-passed cells to the pretraining corpus (2 rows, 10X v2 and v3) — and
      the Geneformer repo ships a fine-tuning input named
      example_input_files/gene_classification/notch1_network/heart_atlas_endothelial_cells.dataset.
      It is not yet verified whether that file derives from the same atlas. If it does, it is an
      in-corpus fine-tuning input — which is the exact configuration Geneformer tested
      itself and reported as giving "essentially equivalent results."
    - >
      Exposure, not effect. Geneformer's own in/out experiment found essentially
      equivalent downstream results for cells included versus excluded from pretraining.
      Nothing here is a claim that any Geneformer number is inflated.

provenance:
  verified_by: ""
  verified_date: null
  method: manual (Supplementary Table 1 + HF dataset card + HF API + PMC10949956 Methods)
  reproducible: true
