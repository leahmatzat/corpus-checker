schema_version: 3
id: uce
model: UCE (Universal Cell Embeddings)
version: "33-layer model from the paper (650M parameters); the repository's default 4-layer model is an ablation"
model_class: foundation

paper:
  doi: 10.1038/s41586-026-10689-z
  pmid: "42420460"
  journal: Nature
  published: 2026-07
  preprint: 10.1101/2023.11.28.568918
  note: >
    Scored against the published version. The preprint's training list (Extended Data Table 2)
    became Supplementary Table 16.

discovery:
  data_availability:
    checked: true
    found: The first sentence points to Supplementary Table 16; the rest names the evaluation datasets.
  code_availability:
    checked: true
    found: Two GitHub links (snap-stanford/UCE, yhr91/uce_reproduce); no list.
  supplementary_files:
    checked: true
    files: [MOESM1_ESM.pdf, MOESM2_ESM.pdf, MOESM3_ESM.xlsx, MOESM4_ESM.xlsx, MOESM5_ESM.xlsx, MOESM6_ESM.xlsx, MOESM7_ESM.xlsx, MOESM8_ESM.xlsx, MOESM9_ESM.xlsx]
    found: >
      Nine files. MOESM4 is Supplementary Table 16, the training list. MOESM5 (Table 17) lists 25
      CELLxGENE datasets used for the Norn-cell analysis, all of them in Table 16.
  methods:
    checked: true
    found: >
      "Creating IMA and dataset preprocessing" gives the totals (33.9M cells in 285 census datasets,
      2.3M in 28 others) and names census "v.2023-07-10", which is not a public release.
  github_repo:
    checked: true
    found: >
      No dataset list in either repository. The census download script names release "2023-04-25",
      also not a public release.
  hf_model_card:
    checked: true
    found: None from the authors; third-party mirrors carry no list.
  hf_dataset_card:
    checked: true
    found: None.
  archive_deposits:
    checked: true
    found: >
      Zenodo 10.5281/zenodo.19462110 (processed analysis data, about 157 GB) and figshare
      10.6084/m9.figshare.24320806 (weights); neither holds a list.
  preprint_vs_published:
    checked: true
    found: All three preprint versions point to Extended Data Table 2 for the list.

evaluated_on:
  - dataset: tabulasapiens-v2
    task: zero-shot embedding and integration benchmark; label transfer
    obtained_from: the authors (unpublished at training time)
  - dataset: tabulasapiens2022
    task: cell type organisation; scGraph benchmark; human partner for cross-species label transfer
  - dataset: siletti2023-hbca
    task: held-out complex-dataset benchmark
    note: The paper calls it held out ("not seen during training").
  - dataset: schroeder2025-astrocyte
    task: complex-dataset benchmark (597,668 cells)
  - dataset: speranza2021-green-monkey
    task: novel-species zero-shot embedding; label transfer
    obtained_from: GEO GSE156755
  - dataset: hilton2019-naked-mole-rat
    task: novel-species zero-shot embedding; label transfer
    obtained_from: GEO GSE132642
    note: Female samples only.
  - dataset: yamagata2021-chick-retina
    task: novel-species zero-shot embedding; label transfer
    obtained_from: GEO GSE159107
  - dataset: mantri2021-chick-heart
    task: novel-species zero-shot embedding; label transfer
    obtained_from: GEO GSE149457
  - dataset: li2022-fly-cell-atlas
    task: novel-species zero-shot embedding
  - dataset: orozco2020-human-retina
    task: human partner for chick-retina label transfer
  - dataset: conde2022-immune-cell-atlas
    task: label-transfer classifier, applied to Tabula Sapiens v2
  - dataset: bakken2021-motor-cortex
    task: homolog-gene analysis
  - dataset: zhang2024-limb
    task: homolog-gene analysis
  - dataset: kragesteen2023-epo-kidney
    task: Norn-cell classifier
    obtained_from: GEO GSE193321
  - dataset: adams2020-ipf-lung
    task: Norn-like cells by disease
    obtained_from: GEO GSE136831

