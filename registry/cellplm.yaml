      caveats:
        - >
          Table 6 names 28 sources. 12 carry an accession or PMID; the other 16, and the spatial
          part of the corpus, are collections or sources named without an identifier. Until they
          are resolved, no dataset can be shown absent from this corpus, only present.
        - >
          The authors describe a later corpus. The first author wrote (GitHub issue #5,
          2024-03-27) that checkpoints trained after September 2023 used CELLxGENE Census
          2023-05-15. This entry scores the corpus the paper describes; a census-trained
          checkpoint would be a separate entry.
        - >
          The paper states that four of its evaluation datasets were left out of pretraining: Li
          et al. 2020, PBMC 5K and Jurkat, and the Vizgen study (Lung2 and Liver2).
        - >
          Exposure, not effect. Overlap does not by itself mean any reported number is
          inflated.

