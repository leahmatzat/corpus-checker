  - dataset: li2020-aorta
    task: zero-shot cell embedding (clustering)
    obtained_from: GEO GSE155468
  - dataset: 10x-pbmc-5k
    task: denoising
    obtained_from: 10x Genomics
  - dataset: 10x-jurkat
    task: denoising
    obtained_from: 10x Genomics
  - dataset: vizgen-ffpe-lung2
