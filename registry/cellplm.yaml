corpora:
  - stage: pretraining
    name: CellPLM pretraining corpus (Table 6, ~8.7M scRNA-seq cells, plus 2.7M CosMx spatial cells)
    manifest:
      type: A
      identifier_type: mixed
      quote: >
        "scRNA-seq data consist of 4.7 million cells from human tumor cell atlas (HTCA,
        https://humantumoratlas.org/), 1.4 million cells from human cell atlas (HCA,
        https://www.humancellatlas.org/), and 2.6 million cells from Gene Expression Omnibus (GEO,
        https://www.ncbi.nlm.nih.gov/geo/). All of them are public available data, elucidated in
        table 6. A more detailed list and external links will be disclosed in our GitHub repository."
      as_of: 2026-10-14
      resolver: table
      keys_available: [accession, pmid]
      requires_keys: [accession, pmid]
      sources:
        - name: Table 6 (ICLR 2024 proceedings PDF, p.18)
          url: https://proceedings.iclr.cc/paper_files/paper/2024/file/173bcdbd820edbe43284e0941109ada9-Paper-Conference.pdf
          extract: extracts/cellplm/table6.csv
          format: pdf
          level: study
          records: 28
          columns: [group, entry, accession, pmid]
          roles: {accession: [accession], pmid: pmid}
          bytes: 6685800
          sha256: da19b4e51a32b5414c22a7b82776df4f77661fa095d1cabc272746bbceca8ded
          acquired: fetched
          confirmation: {method: url_hash, date: 2026-10-14}
          note: >
            The list is a table in the paper, so the extract is a transcription: all 28 entries, as
            printed and in printed order, with the accession or PMID an entry carries.
      unresolved_entries:
        - {entry: HTAN_HTAPP, kind: collection, note: a Human Tumor Atlas Network centre}
        - {entry: HTAN_Stanford, kind: collection, note: a Human Tumor Atlas Network centre}
        - {entry: HTAN_Vanderbilt, kind: collection, note: a Human Tumor Atlas Network centre}
        - {entry: HTAN_BU, kind: collection, note: a Human Tumor Atlas Network centre}
        - {entry: cxg_PBMCs, kind: collection, note: "by its name, a selection from CELLxGENE"}
        - {entry: cxg_Airways, kind: collection, note: "by its name, a selection from CELLxGENE"}
