schema_version: 3
id: cellplm
model: CellPLM
version: "20230926 checkpoint (the default in the paper's own scripts), pretrained on the corpus in Table 6"
model_class: foundation

paper:
  openreview: BKXvPDekud
  url: https://proceedings.iclr.cc/paper_files/paper/2024/hash/173bcdbd820edbe43284e0941109ada9-Abstract-Conference.html
  journal: International Conference on Learning Representations (ICLR 2024)
  published: 2024-05
  preprint: 10.1101/2023.10.03.560734
  absent:
    - key: doi
      checked: 2026-10-14
      basis: >-
        ICLR proceedings papers are not DOI-registered: the proceedings page and its BibTeX give no DOI,
        and a Crossref title search returns only the bioRxiv preprint (posted-content).
    - key: pmid
      checked: 2026-10-14
      basis: >-
        PubMed has no record: esearch for the title "Pre-training of Cell Language Model Beyond Single
        Cells"[title] and for CellPLM[title] both return 0 (NCBI E-utilities).
  note: >
    Scored against the ICLR version. The bioRxiv preprint (one version) has no list of training
    data; the ICLR version adds Table 6. The OpenReview id is the one the authors give in the
    repository README; OpenReview itself blocks scripted access, so it was not opened here.

discovery:
  data_availability:
    checked: true
    found: >
      No section by that name. The Reproducibility Statement (p.10) says all data are public and
      that "The data sources are specified in the appendix" — Appendix E.2 and Table 6.
  code_availability:
    checked: true
    found: >
      GitHub OmicsML/CellPLM: fine-tuning and zero-shot code and checkpoints. The pretraining code
      is not released (author, GitHub issues #2 and #9).
  supplementary_files:
    checked: true
    found: >
      The proceedings supplement (a zip of 41 files) holds a second copy of the appendix with the
      same Table 6, and the scripts for the paper's experiments; no separate dataset list.
  methods:
    checked: true
    found: Appendix E.2 describes the corpus and points to Table 6 (p.18); Appendices F and G describe each task's data.
  github_repo:
    checked: true
    found: >
      No dataset list in any file or commit. The "more detailed list" the paper promises was not
      published; the first author wrote that the exact data will not be released (issue #18), and
      that checkpoints trained after September 2023 used CELLxGENE Census 2023-05-15 (issue #5).
  hf_model_card:
    checked: true
    found: None from the authors (search "cellplm", 2026-10-10).
  hf_dataset_card:
    checked: true
    found: None (search "cellplm", 2026-10-10).
  archive_deposits:
    checked: true
    found: >
      None on Zenodo, figshare, Dryad or OSF. The authors distribute checkpoints and tutorial data
      from a Dropbox folder linked in the README; it holds no pretraining data or list.
  preprint_vs_published:
    checked: true
    found: >
      The preprint (2023-10-05, one version) gives the same corpus sizes but no Table 6; it says a
      more detailed list "will be disclosed" on GitHub.

