    obtained_from: Vizgen MERSCOPE FFPE showcase
  - dataset: vizgen-ffpe-liver2
    task: spatial transcriptomic imputation (query)
    obtained_from: Vizgen MERSCOPE FFPE showcase
  - dataset: kim2020-luad
    task: spatial transcriptomic imputation (reference scRNA-seq for Lung2)
    obtained_from: GEO GSE131907
  - dataset: ma2021-liver
    task: spatial transcriptomic imputation (reference scRNA-seq for Liver2)
    obtained_from: GEO GSE151530
  - dataset: baron2016
    task: cell type annotation
