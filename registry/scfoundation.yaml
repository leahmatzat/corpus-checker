# Worked example. Every claim carries a source quote — see docs/ADDING_A_MODEL.md.

schema_version: 2
id: scfoundation
model: scFoundation
version: "100M parameters, checkpoint 01B-resolution"
model_class: foundation

paper:
  doi: 10.1038/s41592-024-02305-7
  pmid: 38844628
  journal: Nature Methods
  published: 2024-06
  note: >
    Scored against this published version. The bioRxiv v4 preprint (2023.05.29.542705)
    does NOT contain the dataset list — it describes sources in prose only, which would
    classify as Type C-vague. The manifest exists only in the published version.

# Where we looked for a training-data manifest. Locations not documented as checked are
# recorded as unchecked rather than guessed.
discovery:
  data_availability:
    checked: true
    found: Pointer to Supplementary Data 1 and 2, one clause inside a long sentence.
  code_availability:     {checked: false}
  supplementary_files:
    checked: true
    found: Supplementary Data 1 (sample-level) and Supplementary Data 2 (study-level).
    note: Whether every other supplementary file title was enumerated is not recorded.
  methods:               {checked: false}
  github_repo:           {checked: false}
  hf_model_card:         {checked: false}
  hf_dataset_card:       {checked: false}
  archive_deposits:      {checked: false}
  preprint_vs_published:
    checked: true
    found: Preprint v4 has no dataset list; the manifest exists only in the published version.

evaluated_on:
  - dataset: norman2019
    task: perturbation prediction (2-gene)
    obtained_from: GEARS repo
  - dataset: adamson2016
    task: perturbation prediction (1-gene)
    obtained_from: GEARS repo
  - dataset: dixit2016
    task: perturbation prediction (1-gene)
    obtained_from: GEARS repo
  - dataset: baron2016
    task: read-depth enhancement / clustering
  - dataset: zheng2017-pbmc68k
    task: clustering
  - dataset: segerstolpe2016
    task: published-version evaluation

corpora:
  - stage: pretraining
    name: scFoundation pretraining corpus (~50M cells)
    manifest:
      type: A
      identifier_type: accession
      quote: >
        "The pretraining datasets were mainly downloaded from GEO, Single Cell Portal,
        HCA and EMBL-EBI, and the detailed dataset list we used is in
        Supplementary Data 1 and 2."
      as_of: 2026-09-08
      resolver: xlsx_two_table
      keys_available: [accession, pmid, title]
      requires_keys: [accession, pmid]
      sources:
        # sha256 is what makes "as_of" verifiable: a URL can serve different bytes later.
        # Anyone can re-download and confirm they are looking at the file we scored.
        - name: Supplementary Data 1
          url: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41592-024-02305-7/MediaObjects/41592_2024_2305_MOESM4_ESM.xlsx
          extract: extracts/scfoundation/data1.csv
          format: xlsx
          level: sample
          records: 10747
          columns: [project_ID, sample_ID, cell_number_reserved]
          roles: {accession: [project_ID, sample_ID], project: project_ID, sample: sample_ID, cells: cell_number_reserved}
          bytes: 280312
          sha256: 786c6962d01bbeeffcc88335d2e2e762f333daf399c649bec3916bc4ef2209d0
          acquired: fetched
          confirmation: {method: url_hash, date: 2026-09-08}
        - name: Supplementary Data 2
          url: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41592-024-02305-7/MediaObjects/41592_2024_2305_MOESM5_ESM.xlsx
          extract: extracts/scfoundation/data2.csv
          format: xlsx
          level: study
          records: 522
          columns: [Project ID, Study Title, pubmed ID]
          roles: {accession: [Project ID], project: Project ID, pmid: pubmed ID, title: Study Title}
          bytes: 44723
          sha256: 681c1d8827145730200755cb558462813e5c2562bac75361c7208ff35ecf6e4b
          acquired: fetched
          confirmation: {method: url_hash, date: 2026-09-08}
      totals:
        cells: 55040785
        samples: 10747
        projects: 656
      # Why dual-key matching is mandatory for this model:
      gaps:
        blank_pmids_in_study_table: 161   # of 522
        projects_absent_from_study_table: 134  # of 656 — accession only, no title, no PMID
        multi_id_pmid_cells: 21           # "31067475 || 33521016", "31924475;34099645", one DOI

    result:
      checked: 2026-09-08
      sources_searched: [Supplementary Data 1, Supplementary Data 2]
      findings:
        - dataset: norman2019
          verdict: PRESENT
          keys_attempted: [accession, pmid]
          matched_on: [accession, pmid]
          match_level: dataset
          overlap_level: sample
          samples: 8
          sample_ids: [GSM3906020, GSM3906021, GSM3906022, GSM3906023, GSM3906024, GSM3906025, GSM3906026, GSM3906027]
          cells: 125081
          note: >
            GEO lists 16 samples for GSE133344; the corpus contains the 8 that are
            "sgRNA perturb-seq experiment" files. The other 8 are guide-barcode files,
            correctly excluded. The expression data was ingested, deliberately processed.
        - dataset: adamson2016
          verdict: NOT PRESENT
          keys_attempted: [accession, pmid]
        - dataset: dixit2016
          verdict: NOT PRESENT
          keys_attempted: [accession, pmid]
        - dataset: baron2016
          verdict: NOT PRESENT
          keys_attempted: [accession, pmid]
        - dataset: zheng2017-pbmc68k
          verdict: NOT PRESENT
          keys_attempted: [accession, pmid]
          identity: provisional
          identity_basis: >-
            SRA experiment titled "Fresh 68k PBMCs (Donor A)", Homo sapiens, submitted by 10X Genomics
            with contact Grace Zheng (the paper's first author). NCBI has no link between this record
            and PMID 28091601 in either direction (checked 2026-09-24), so the identification rests on
            title and submitter.
          note: >
            Searched on the SRA experiment and run (SRX1723926, SRR3561754) and on PMID
            28091601; none appears. The manifest does carry SRA and ENA sample accessions
            (399 sample rows), so the accession search is a real one. The original audit's
            accession, GSE93421, is the same paper's mouse-brain dataset, not Zheng68K.
        - dataset: segerstolpe2016
          verdict: NOT PRESENT
          keys_attempted: [accession, pmid]

      caveats:
        - >
          The paper's prose describes the corpus as organs, tissues, diseases and cancer
          regions and names no perturbation screens — but 9 of 522 documented studies are
          CRISPR/screen studies.
        - >
          Exposure, not effect. Geneformer's own in/out experiment found "essentially
          equivalent" downstream results for cells included vs excluded from pretraining,
          so overlap does not by itself imply an inflated number.

provenance:
  verified_by: LM
  verified_date: 2026-09-24
  method: original audit script (2026-09-08); reproduced by `corpus-checker check scfoundation --manifests DIR`
  reproducible: true
